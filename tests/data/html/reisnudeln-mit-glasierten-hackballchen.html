<script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Recipe\",\"name\":\"Reisnudeln mit glasierten Hackbällchen\",\"image\":\"https://storefront-prod.de.picnicinternational.com/static/images/recipes/371253990b314f6027a8629e81e979b1d21463ee7a7e279c1e2a039691f16e71/filled-600x600.webp\",\"description\":\"Die Hackbällchen verwandeln sich dank der Soße in echte Geschmacksbomben – und sind blitzschnell auf dem Tisch.\",\"author\":{\"@type\":\"Organization\",\"name\":\"Picnic\",\"url\":\"https://picnic.app\",\"logo\":\"https://picnic.app/_next/static/assets/general/img/picnic-logo.png\"},\"totalTime\":\"PT20M\",\"recipeIngredient\":[\"300 g Breite Reisnudeln\",\"1 Bund Frühlingszwiebeln\",\"2 Stk. Paprika\",\"2 Stk. Möhren\",\"500 g Putenhackfleisch\",\"1 TL Ingwer gemahlen\",\"200 ml Asiatische Soße\",\"50 ml Reisessig\",\"Sesam weiß\",\"1 Stk. Ei\",\"3 EL Paniermehl\",\"3 EL Honig\",\"150 ml Sojasoße\",\"2 Zehen Knoblauch\",\"Salz\",\"Pfeffer\",\"4 EL Rapsöl\",\"EL Sriracha\"],\"recipeInstructions\":[{\"@type\":\"HowToStep\",\"text\":\"In einem Topf Salzwasser zum Kochen bringen und darin 300 g Breite Reisnudeln nach Packungsanweisung gar kochen. Abgießen und beiseitestellen.\",\"name\":\"Schritt 1\"},{\"@type\":\"HowToStep\",\"text\":\"2 Knoblauchzehen schälen und fein hacken. 1 Bund Frühlingszwiebeln waschen, die Wurzeln entfernen und 2/3 des Bundes in 3 cm lange Stücke schneiden. Übrige Frühlingszwiebeln schräg schneiden und beiseitestellen. 2 Paprika waschen und in Streifen schneiden. 2 Möhren schälen und grob raspeln.\",\"name\":\"Schritt 2\"},{\"@type\":\"HowToStep\",\"text\":\"In einer Schüssel 500 g Putenhackfleisch mit 1 Ei, 3 EL Paniermehl, 0,5 TL Ingwer, gemahlen, der Hälfte des Knoblauchs, Salz und Pfeffer vermengen. Aus der Masse mit feuchten Händen 2 cm große Hackbällchen formen.\",\"name\":\"Schritt 3\"},{\"@type\":\"HowToStep\",\"text\":\"In einer großen Pfanne 2 EL Öl bei mittlerer Hitze erwärmen und Hackbällchen darin 5 Min. von allen Seiten goldbraun anbraten.\",\"name\":\"Schritt 4\"},{\"@type\":\"HowToStep\",\"text\":\"In einer Schüssel 200 ml Asiatische Soße (z.B. Hoisin- oder Teriyaki-Soße), 50 ml Reisessig, 3 EL Honig, übrigen Knoblauch, 0,5 TL Ingwer, gemahlen und 150 ml Sojasoße mischen und zu den Hackbällchen in die Pfanne geben. Dann 5 Min. köcheln lassen, bis die Soße leicht eindickt. Mit Sojasoße abschmecken.\",\"name\":\"Schritt 5\"},{\"@type\":\"HowToStep\",\"text\":\"In einer zweiten großen Pfanne 2 EL Öl bei mittlerer Hitze erwärmen und Frühlingszwiebel-Stücke und geraspelte Möhren darin 2 Min. anbraten. Paprikastreifen zufügen und 3 Min. mitbraten lassen. Gekochte Reisnudeln unterrühren und 1 Min. mitbraten.\",\"name\":\"Schritt 6\"},{\"@type\":\"HowToStep\",\"text\":\"Reisnudeln-Gemüse-Mischung auf Tellern verteilen. Glasierte Hackbällchen mit Soße darauf verteilen und alles mit schräg geschnittenen Frühlingszwiebeln und Sesam bestreut servieren.\",\"name\":\"Schritt 7\"},{\"@type\":\"HowToTip\",\"text\":\"Ein wenig Sriracha macht aus dem Gericht ein würzig-scharfes Geschmackserlebnis. Keine Hoisin-Sauce zur Hand? Einfach Teriyaki Sauce nutzen - funktioniert genauso gut!\",\"name\":\"Tipp\"}]}"])</script>
